services:
  postgres:
    image: postgres:18.6-alpine
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local password in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platform -d platform']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
