name: Sprint 0 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_DB: platform
          # Disposable runner-only value; no stored or production credential.
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://platform:${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/platform?schema=public
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install the pinned package manager on the disposable CI runner
        run: npm install --global pnpm@11.19.0
      - name: Install project dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm db:validate
      - name: Verify PostgreSQL migration and repeatable seed
        run: |
          pnpm db:deploy
          pnpm db:seed
          pnpm db:seed
          pnpm db:check
      - run: pnpm build
